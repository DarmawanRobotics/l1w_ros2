camera_name: camera
camera_namespace: camera
enable_color: true
rgb_camera.color_profile: 640,480,15
# Depth for the obstacles below the LiDAR (Pashupati: lidar_sector_node depth.*), as a point
# cloud on /camera/camera/depth/color/points: 424 x 240, decimated by 2 to 212 x 120 points,
# without texture (stream_filter 0: the whole depth field, wider than the color camera's, and
# no wait for color frames). Off: enable_depth and pointcloud.enable false.
enable_depth: true
depth_module.depth_profile: 424,240,15
decimation_filter.enable: true
pointcloud.enable: true
pointcloud.stream_filter: 0
clip_distance: 4.0 # m, farther depth is dropped (the obstacles need 3 m)
enable_infra1: false
enable_infra2: false
enable_gyro: false
enable_accel: false
initial_reset: false
publish_tf: true
tf_publish_rate: 0.0
