camera_name: camera
camera_namespace: camera
enable_color: true
rgb_camera.color_profile: 640x480x15
# Depth for the obstacles below the LiDAR (Pashupati: lidar_sector_node depth.*), as a point
# cloud on /camera/camera/depth/color/points: 640 x 480 at 15 fps (the D435i's own depth mode
# on USB 2 as well), decimated by 4 to 160 x 120 points, without texture (stream_filter 0: the
# whole depth field, wider than the color camera's, and no wait for color frames).
# On ARM (the Jetson) librealsense names the block "Pointcloud (NEON)", so its parameters are
# pointcloud__neon_.*; elsewhere pointcloud.*. Both are set; a name the node lacks is ignored.
# Off: enable_depth and both enable false.
enable_depth: true
depth_module.depth_profile: 640x480x15
decimation_filter.enable: true
decimation_filter.filter_magnitude: 4
pointcloud.enable: true
pointcloud.stream_filter: 0
pointcloud__neon_.enable: true
pointcloud__neon_.stream_filter: 0
clip_distance: 4.0 # m, farther depth is dropped (the obstacles need 3 m)
enable_infra1: false
enable_infra2: false
enable_gyro: false
enable_accel: false
initial_reset: false
publish_tf: true
tf_publish_rate: 0.0
